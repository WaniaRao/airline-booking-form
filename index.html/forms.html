<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body  background="https://www.solidbackgrounds.com/images/2480x3508/2480x3508-light-steel-blue-solid-color-background.jpg">
    <h1 align="center" style="color: rgb(18, 18, 125); font-family: Arial, sans-serif;">✈ Airline Reservation Form</h1>
    <div>
         <div class="container"style="max-width: 900px; margin: auto; background: url('./airline.jpg'); padding: 30px; border-radius: 15px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);">

        <form >

            <!-- Section 1 -->
            <fieldset >
                <legend style="color: rgb(204, 222, 88); font-weight: bold ;">Passenger Information</legend>

                <div class="form-group"style="margin-bottom: 10px;">
                    <label  style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Full Name</label>
                    <br>
                    <input type="text" placeholder="Enter your full name" size="120" maxlength="20" style="padding: 10px;">
                </div>


                <div class="form-group"style="margin-bottom: 10px;">
                    <label  style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Email Address</label>
                    <br>
                    <input type="email" placeholder="Enter your email" style="padding: 10px;" maxlength="30" size="120">
                </div>


                <div class="form-group"style="margin-bottom: 10px;">
                    <label style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Phone Number</label>
                    <br>
                    <input type="tel" placeholder="Enter your phone number" style="padding: 10px;" maxlength="15" size="120">
                </div>


                <div class="form-group"style="margin-bottom: 10px;">
                    <label  style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Date of Birth</label>
                    <br>
                    <input type="date" style="padding: 10px;">
                </div>
                <br>

                <div class="radio-group">
                    <label style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Gender</label>
                </div>
                 <div style="color: rgb(250, 250, 253);">
                    <input type="radio" name="gender" style="margin-right: 10px;" > Male
                    <input type="radio" name="gender" style="margin-right: 10px;"> Female
                    <input type="radio" name="gender"> Other
                </div>

            </fieldset>
            <br>



           <fieldset>

                <legend style="color: rgb(204, 222, 88); font-weight: bold ;">Flight Details</legend>

                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Departure City</label>
                    <br>
                    <input type="text" placeholder="e.g Karachi"style="padding: 10px;" maxlength="20" size="120">
                </div>


                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Destination City</label>
                    <br>
                    <input type="text" placeholder="e.g Dubai" style="padding: 10px;" maxlength="20" size="120">
                </div>


                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Departure Date</label>
                    <br>
                    <input type="date" style="padding: 10px;" size="120">
                </div>


                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Return Date</label>
                    <br>
                    <input type="date" style="padding: 10px;" size="120">
                </div>


                <div class="form-group" style="margin-bottom: 10px;" >
                    <label style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;"  >Travel Class</label>
                    <br>

                    <select style="padding: 10px;" >
                        <option>Economy</option>
                        <option>Business</option>
                        <option>First Class</option>
                    </select>
                </div>

            </fieldset>
            <br>



            <fieldset>

                <legend style="color: rgb(204, 222, 88); font-weight:bold ;">Preferences</legend>
                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Meal Preference</label>
                    <br>

                    <select style="padding: 10px;" >
                        <option>Vegetarian</option>
                        <option>Non-Vegetarian</option>
                        <option>Vegan</option>
                    </select>
                </div>


                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Seat Preference</label>
                    <br>

                    <select style="padding: 10px;" style="color: rgb(250, 250, 253);">
                        <option>Window Seat</option>
                        <option>Aisle Seat</option>
                        <option>Middle Seat</option>
                    </select>
                </div>


                <div class="checkbox-group" style="margin-bottom: 10px;">
                    <label style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Additional Services</label>
                 </div>

                 <div style="color: rgb(250, 250, 253);">
                    <input type="checkbox" > Extra Baggage <br>
                    <input type="checkbox" > Wheelchair Assistance <br>
                    <input type="checkbox" > Priority Boarding
                </div>
                 <br>


                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Special Instructions</label>
                    <br>
                    <textarea rows="4" style="padding: 10px;" size="125"></textarea>
                </div>

            </fieldset>
            <br>



             <fieldset>
                <legend style="color: rgb(204, 222, 88); font-weight: bold ;">Payment & Confirmation</legend>

                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Card Holder Name</label>
                    <br>
                    <input type="text" style="padding: 10px;" maxlength="30" size="120">
                </div>


                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Card Number</label>
                    <br>
                    <input type="text" placeholder="XXXX-XXXX-XXXX-XXXX" style="padding: 10px;" maxlength="19" size="120">
                </div>


                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">Expiry Date</label>
                    <br>
                    <input type="month" style="padding: 10px;"size="120">
                </div>


                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="color: rgb(250, 250, 253); font-family: Arial, sans-serif;">CVV</label>
                    <br>
                    <input type="password" style="padding: 10px;"maxlength="4" size="120">
                </div>

            </fieldset>
            <br>
              <center> <button type="submit" style="background-color: #153b64; color: white; border: none; padding: 10px 20px; font-size: 13px; cursor: pointer;">Book Flight</button></center>

        </form>

    </div>
    </div>
</body>
</html>
